# On every push, run clang-format over the C++ sources and push any changes
# back if the code was not already formatted.
name: auto-format

on:
  push: {}

permissions:
  contents: write

jobs:
  format-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install clang-format
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-format

      - name: Format code
        # Same command as the local `just format` recipe.
        run: |
          find src -type f \( -name '*.cpp' -o -name '*.hpp' \) -exec clang-format -i {} +

      - name: Commit changes if needed
        run: |
          if [ -z "$(git status --porcelain src)" ]; then
            echo "No formatting changes needed."
            exit 0
          fi

          git config user.name "moca-ci-bot"
          git config user.email "moca-ci-bot@users.noreply.github.com"
          git add src
          git commit -m "chore(ci): auto-format code with clang-format"

          # Note: if the branch is protected, this push will fail until the
          # Actions token is allowed to push to it; you can then push the
          # formatting changes manually.
          git push origin HEAD
